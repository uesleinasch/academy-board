name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] || fail "$TAG não é uma tag anotada."

          commit=$(git rev-list -n1 "$TAG")
          git merge-base --is-ancestor "$commit" origin/production || fail "$TAG não está em production."

          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$commit^" 2>/dev/null || echo v0.0.0)
          [ "$(printf '%s\n%s\n' "$previous" "$TAG" | sort -V | tail -n1)" = "$TAG" ] && [ "$previous" != "$TAG" ] \
            || fail "$TAG não é maior que a versão anterior ($previous)."

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gerar pacote
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: make package VERSION="$VERSION"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist/

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: git-cliff

      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git cliff --latest --strip header > notes.md
          gh release create "$TAG" dist/*.tar.gz --verify-tag --title "$TAG" --notes-file notes.md --latest

  main-sync-reminder:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar intervalo do backup em main
        env:
          EVERY: ${{ vars.MAIN_SYNC_EVERY }}
          TAG: ${{ github.ref_name }}
        run: |
          every="$EVERY"
          if [ -z "$every" ] && [ -f .claude/conventions.json ]; then
            every=$(jq -r '.mainSyncEvery // empty' .claude/conventions.json)
          fi
          every="${every:-2}"

          pending=$(git tag -l 'v[0-9]*' --merged origin/production --no-merged origin/main | grep -cE '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          echo "### $pending release(s) publicadas desde o último backup em main (intervalo: $every)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$pending" -ge "$every" ]; then
            echo "::notice::Abra o PR production → main: gh pr create --base main --head production --title \"chore(release): backup estável $TAG\""
          fi
